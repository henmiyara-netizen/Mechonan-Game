<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>מסע חכם בגלקסיה</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/sprites/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <div id="app" class="app">

    <!-- Loading splash -->
    <section id="screen-splash" class="screen screen--active">
      <div class="splash">
        <div class="splash__logo">🚀</div>
        <h1 class="splash__title">מסע חכם בגלקסיה</h1>
        <div class="splash__loader"><div class="splash__bar"></div></div>
      </div>
    </section>

    <!-- User profile picker -->
    <section id="screen-profiles" class="screen">
      <div class="container">
        <h1 class="title">בחר טייס</h1>
        <ul id="profile-list" class="profile-list"></ul>
        <button id="btn-add-profile" class="btn btn--primary">+ טייס חדש</button>
      </div>
    </section>

    <!-- Main menu -->
    <section id="screen-menu" class="screen">
      <div class="container">
        <header class="menu__header">
          <div class="menu__pilot">
            <span class="menu__pilot-label">טייס:</span>
            <span id="menu-pilot-name" class="menu__pilot-name">—</span>
            <button id="btn-switch-profile" class="btn btn--ghost btn--small">החלף</button>
          </div>
          <div class="menu__progress">
            <span class="menu__rank-label">דרגה:</span>
            <strong id="menu-level" class="menu__rank">🎓 טירון</strong>
            <div class="xp-bar"><div id="menu-xp-fill" class="xp-bar__fill"></div></div>
          </div>
        </header>

        <h1 class="title title--big">מסע חכם בגלקסיה</h1>

        <div class="menu__buttons">
          <button id="btn-play" class="btn btn--primary btn--big">🚀 המשך משימה</button>
          <button id="btn-practice" class="btn btn--secondary">📚 תתרגל ותרוויח</button>
          <button id="btn-hangar" class="btn btn--secondary">🚀 מוסך החלליות</button>
          <button id="btn-shop" class="btn btn--secondary">🏪 חנות שדרוגים</button>
          <button id="btn-progress" class="btn btn--ghost">📊 ההתפתחות שלי</button>
          <button id="btn-credits" class="btn btn--ghost">קרדיטים</button>
        </div>
      </div>
    </section>

    <!-- Game screen (canvas) -->
    <section id="screen-game" class="screen screen--game">
      <div class="game-wrap">
        <canvas id="game-canvas" class="game-canvas"></canvas>
        <div id="game-hud" class="hud">
          <div class="hud__top">
            <div class="hud__cell">שלב <strong id="hud-level">1</strong></div>
            <div class="hud__cell">גל <bdi><strong id="hud-wave">1</strong>/<span id="hud-wave-total">5</span></bdi></div>
            <div class="hud__cell">חיים <strong id="hud-lives">3</strong></div>
            <div class="hud__cell">XP <strong id="hud-xp">0</strong></div>
            <div class="hud__cell">🪙 <strong id="hud-coins">0</strong></div>
          </div>
          <div class="hud__bottom">
            <div class="hud__cell hud__cell--weapon">נשק: <strong id="hud-weapon">בודד</strong></div>
            <button id="btn-pause" class="btn btn--ghost btn--small">⏸</button>
          </div>
        </div>
        <div id="game-touch-controls" class="touch-controls" aria-hidden="true">
          <div class="touch-controls__pad"></div>
          <button class="touch-controls__fire">ירי</button>
        </div>
      </div>
    </section>

    <!-- Question overlay -->
    <section id="screen-question" class="screen screen--overlay">
      <div class="question">
        <div class="question__header">
          <span id="question-topic" class="question__topic">חשבון</span>
          <span id="question-counter" class="question__counter">1 / 5</span>
        </div>
        <div id="question-body" class="question__body"></div>
        <ul id="question-choices" class="question__choices"></ul>
        <div id="question-feedback" class="question__feedback"></div>
      </div>
    </section>

    <!-- Progress screen -->
    <section id="screen-progress" class="screen">
      <div class="container">
        <header class="screen__header">
          <button id="btn-progress-back" class="btn btn--ghost">← חזרה</button>
          <h1 class="title">ההתפתחות שלי</h1>
        </header>
        <div id="progress-stats"></div>
      </div>
    </section>

    <!-- Shop screen (overlay, dynamically created) -->

    <!-- Reusable modal -->
    <div id="modal" class="modal" hidden>
      <div class="modal__backdrop"></div>
      <div class="modal__panel">
        <h2 id="modal-title" class="modal__title"></h2>
        <div id="modal-body" class="modal__body"></div>
        <div id="modal-actions" class="modal__actions"></div>
      </div>
    </div>

  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
